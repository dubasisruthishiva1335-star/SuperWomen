name: SuperWomen CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-api-build:
    name: Build NestJS API & Prisma
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build API
        working-directory: ./services/api
        run: |
          npm install
          npx prisma generate --schema=../../database/schema.prisma
          npm run build

  admin-web-build:
    name: Build Admin Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Admin Web
        working-directory: ./apps/admin-web
        run: |
          npm install
          npm run build

  flutter-captain-build:
    name: Build Captain Flutter App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Captain App Dependencies
        working-directory: ./mobile/captain_app
        run: flutter pub get

      - name: Analyze Captain App
        working-directory: ./mobile/captain_app
        run: flutter analyze

  flutter-rider-build:
    name: Build Rider Flutter App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Rider App Dependencies
        working-directory: ./mobile/rider_app
        run: flutter pub get

      - name: Analyze Rider App
        working-directory: ./mobile/rider_app
        run: flutter analyze
